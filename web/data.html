  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<body>

  <aside class="sidebar" id="sidebar">
    <div class="menu-toggle" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></div>

    <a href="routing.html" class="menu-item">
      <span class="material-symbols-outlined" style="color: #0f9d58;">directions_run</span>
      <span class="menu-text">健康防護導航</span>
    </a>
    <a href="news.html" class="menu-item"><span class="material-symbols-outlined">campaign</span><span class="menu-text">環境快訊與氣象</span></a>
    <div class="sidebar-section-title">數據與圖表</div>
    <a href="map.html" class="menu-item"><span class="material-symbols-outlined">explore</span><span class="menu-text">即時地圖</span></a>

  <main class="main-content">
    <a href="news.html" class="freshness-marquee" title="點擊查看環境局最新快訊與觀測建議">
      <div class="marquee-content" id="dynamic-marquee">資料讀取中...</div>
    </a>

    <noscript>
      <div style="padding: 20px; background: #fff3cd; color: #856404; font-size: 14px; text-align: center;">
        <p>此頁面需要 JavaScript 才能載入感測數據表格。PM2.5 數據即時更新中。</p>
      </div>
    </noscript>

    <div id="view-data" class="view-section active">
      <div class="data-header">
        <div class="data-title-group">
          <h1 style="font-size:20px;margin:0 0 4px 0;color:#1f1f1f;">Google Sheets 原始數據紀錄</h1>
          <span id="data-status" style="color: #444746; font-size: 14px;">資料讀取中...</span>
        </div>

        <div class="btn-group">
          <a href="charts.html" class="action-btn btn-chart">
            <span class="material-symbols-outlined">insights</span>
            查看分析圖表
          </a>

          <button class="action-btn btn-refresh" onclick="refreshData()">
            <span class="material-symbols-outlined">refresh</span>
            更新數據
          </button>

          <button class="action-btn" onclick="downloadCSV()"
            style="color:#0f9d58;border-color:#0f9d58;background:#e6f4ea;" title="下載含縣市地區的完整 CSV 檔">
            <span class="material-symbols-outlined">download</span>
            下載 CSV
          </button>
        </div>
      </div>

      <div id="data-scroll-container" style="overflow-y: auto; height: calc(100vh - 100px);">
        <table>
          <caption style="text-align: left; font-size: 13px; color: #666; margin-bottom: 8px;">
            實時更新的 PM2.5 監測數據（包含時間戳記、濃度、空氣品質狀態與經緯度）
          </caption>
          <thead>
            <tr>
              <th scope="col">時間戳記</th>
              <th scope="col">PM2.5 (µg/m³)</th>
              <th scope="col">縣市地區</th>
              <th scope="col">狀態等級</th>
              <th scope="col">緯度</th>
              <th scope="col">經度</th>
              <th scope="col">衛星數</th>
            </tr>
          </thead>
          <tbody id="data-table-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="js/common.js"></script>
